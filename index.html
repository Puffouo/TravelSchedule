<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>北海道 ALGS 行</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<script>
const DEFAULT_THEME='snow', SHOW_SWITCHER=true;
(function(){let t=new URLSearchParams(location.search).get('theme');try{t=t||localStorage.getItem('theme')}catch(e){}
document.documentElement.dataset.theme=['snow','diary'].includes(t)?t:DEFAULT_THEME})();
</script>
<style>
:root{--bg:#f6f8f8;--paper:#fff;--ink:#1f2226;--sub:#7a8087;--line:#dde2e4;--ai:#27415f;--ai2:#e7edf3;--shu:#b4452f;--shu2:#f8ebe7;--head:"Shippori Mincho",serif;--body:"Zen Kaku Gothic New","Noto Sans TC",sans-serif;--r:6px;--r2:4px;--rs:3px;--hl:var(--ai2)}
@media(prefers-color-scheme:dark){:root{--bg:#14171a;--paper:#1b1f23;--ink:#e9ecee;--sub:#8e969d;--line:#2d3338;--ai:#93b4da;--ai2:#202a35;--shu:#e8836b;--shu2:#2b1f1c}}
*{box-sizing:border-box}
html{scroll-padding-top:90px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.75;padding-bottom:env(safe-area-inset-bottom)}
.wrap{max-width:680px;margin:0 auto;padding:0 22px}
.serif{font-family:var(--head)}

header{padding:calc(env(safe-area-inset-top) + 44px) 0 26px}
header .wrap{display:flex;gap:22px;align-items:flex-start}
.vt{writing-mode:vertical-rl;font-family:var(--head);font-weight:800;font-size:3.4rem;line-height:1;letter-spacing:.18em;margin:0;color:var(--ink)}
.hd{padding-top:6px}
.hd .sub{font-family:var(--head);font-weight:500;font-size:1.15rem;letter-spacing:.2em}
.hd .rng:empty::before{content:"\200b"}
.hd .rng{color:var(--sub);font-size:.9rem;margin-top:6px;letter-spacing:.08em}
.seal{display:inline-grid;place-items:center;width:2.1rem;height:2.1rem;margin-top:16px;background:var(--shu);color:#fff;font-family:var(--head);font-weight:700;font-size:1.05rem;border-radius:var(--rs);transform:rotate(-4deg)}

nav{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
nav .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav button{flex:none;min-width:58px;background:none;border:0;border-bottom:2px solid transparent;padding:11px 8px 9px;font:inherit;color:var(--sub);cursor:pointer;text-align:center;line-height:1.35;transition:color .15s,border-color .15s}
nav button i{display:block;font-style:normal;font-size:.7rem}
nav button span{display:block;font-family:var(--head);font-weight:700;font-size:1.1rem;color:inherit}
nav button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--shu)}
nav button:focus-visible,a:focus-visible{outline:2px solid var(--ai);outline-offset:2px;border-radius:2px}

main{padding-bottom:30px}
.fade{animation:f .22s ease-out}
@keyframes f{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.fade{animation:none}nav button{transition:none}}

.dh{padding:34px 0 6px}
.dn{color:var(--shu);font-weight:700;font-size:.9rem;letter-spacing:.12em}
.dh h2{font-family:var(--head);font-weight:800;font-size:3.1rem;line-height:1.15;margin:2px 0 0;letter-spacing:.02em}
.dh h2 small{font-size:1.05rem;font-weight:500;color:var(--sub);margin-left:12px;letter-spacing:.1em}
.info{margin-top:16px;display:grid;gap:8px}
.box{display:grid;grid-template-columns:auto 1fr;gap:12px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;font-size:.88rem}
.box b{display:grid;place-items:center;width:1.7rem;height:1.7rem;border:1.5px solid var(--shu);color:var(--shu);border-radius:var(--r2);font-family:var(--head);font-size:.9rem;line-height:1}
.box .v{white-space:pre-wrap}
.box .v strong{display:block;font-weight:700;font-size:.95rem}
.box .v span{color:var(--sub)}

ol{list-style:none;margin:30px 0 0;padding:0}
li{display:grid;grid-template-columns:3.4rem 22px 1fr}
.t{text-align:right;padding-bottom:28px;font-family:var(--head);font-weight:700;font-size:1.02rem;line-height:1.5;padding-top:1px;font-variant-numeric:tabular-nums}
.t:empty::after{content:"";}
.rail{position:relative}
.rail::before{content:"";position:absolute;left:50%;top:.85rem;bottom:0;width:1px;background:var(--line)}
.rail::after{content:"";position:absolute;left:50%;top:.45rem;width:11px;height:11px;margin-left:-5.5px;border-radius:50%;background:var(--ai);border:2px solid var(--bg)}
li:last-child .rail::before{display:none}
li.plain .rail::after{width:7px;height:7px;margin-left:-3.5px;top:.62rem;background:var(--bg);border:1.5px solid var(--sub)}
.b{padding:0 0 28px 8px;min-width:0}
.title{font-weight:700;font-size:1.06rem;line-height:1.5}
li.plain .title{font-weight:500;color:var(--sub);font-size:.98rem}
a.n1,a.n1:visited{color:inherit;text-decoration:none;background:linear-gradient(var(--hl),var(--hl)) 0 100%/100% .45em no-repeat;transition:background-size .15s}
a.n1:hover{background-size:100% 100%}
.pin{display:inline-flex;align-items:center;gap:3px;margin-left:8px;padding:0 8px;border:1px solid var(--line);border-radius:20px;font-size:.72rem;font-weight:500;color:var(--ai);text-decoration:none;vertical-align:2px;white-space:nowrap}
.pin:hover{background:var(--ai2)}
.pin svg{width:10px;height:10px;fill:currentColor}
.d{font-size:.93rem;white-space:pre-wrap;margin-top:1px}
.tr{margin-top:10px;padding:10px 12px;background:var(--ai2);border-radius:var(--r2);border-left:3px solid var(--ai);font-size:.84rem;white-space:pre-wrap}
.n{margin-top:7px;font-size:.82rem;color:var(--sub);white-space:pre-wrap}
.s{display:inline-block;margin-left:8px;padding:0 6px;font-size:.7rem;font-weight:700;border:1px solid;border-radius:var(--rs);line-height:1.5;vertical-align:2px;letter-spacing:.04em}
.s.ok{color:var(--ai);border-color:var(--ai)}
.s.no{color:var(--shu);border-color:var(--shu);background:var(--shu2)}
.msg{padding:70px 0;color:var(--sub);text-align:center;font-size:.92rem}
.pn{display:flex;justify-content:space-between;gap:12px;padding:6px 0 4px}
.pn button{flex:1;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;font:inherit;font-size:.85rem;color:var(--ink);cursor:pointer}
.pn button:hover{border-color:var(--ai)}
.pn button:only-child{max-width:50%}
.pn .nx{margin-left:auto}
footer{padding:22px 0 44px;font-size:.76rem;color:var(--sub);text-align:center}
@media(max-width:430px){.vt{font-size:2.8rem}.dh h2{font-size:2.6rem}li{grid-template-columns:3rem 20px 1fr}}


/* optional places + business hours */
.hr{display:inline-flex;align-items:center;gap:6px;margin:7px 0 3px;padding:2px 11px 2px 9px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r2);font-weight:700;font-size:.9rem;font-variant-numeric:tabular-nums}
.hr svg{width:12px;height:12px;fill:var(--ai)}
.subs{margin-top:12px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:2px 14px}
.sr{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:11px 0;border-bottom:1px solid var(--line)}
.sr:last-child{border-bottom:0}
.sn{min-width:0}
.sn .nm{font-weight:500;font-size:.93rem;line-height:1.5}
.sd{font-size:.8rem;color:var(--sub);white-space:pre-wrap}
.subs a.n1,.subs a.n1:visited{background:none;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:4px;text-decoration-thickness:1.5px}
.subs a.n1:hover{text-decoration-color:var(--ai)}
.sh{flex:none;display:inline-flex;align-items:center;gap:5px;padding:2px 9px;background:var(--ai2);border-radius:var(--r2);font-weight:700;font-size:.84rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.sh svg{width:11px;height:11px;fill:var(--ai)}
.sr{gap:10px}
.sn{flex:1}
.mp{flex:none;display:inline-grid;place-items:center;width:32px;height:32px;border:1px solid var(--line);border-radius:50%;color:var(--ai);background:var(--paper)}
.mp svg{width:13px;height:13px;fill:currentColor}
.mp:hover{background:var(--ai2)}

/* transit */
li.go .rail::after{display:none}
li.go .rail::before{top:0;background:repeating-linear-gradient(to bottom,var(--sub) 0 3px,transparent 3px 7px);opacity:.45}
li.go .t{font-size:.82rem;color:var(--sub);font-weight:500}
li.go .b{padding-bottom:22px;margin-top:-14px}
.tc{background:var(--ai2);border-radius:var(--r2);padding:11px 13px}
.lh{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.lh .s{margin-left:0}
.md{padding:0 8px;border-radius:var(--rs);background:var(--ai);color:var(--bg);font-size:.72rem;font-weight:700;line-height:1.65}
.ln{font-size:.95rem}
.rt{margin-top:3px;font-size:.85rem}
.mt{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:6px;font-size:.85rem;font-weight:700;font-variant-numeric:tabular-nums}
.mt span{display:inline-flex;align-items:center;gap:5px}
.mt svg{width:12px;height:12px;fill:var(--ai)}
.fy{display:inline-grid;place-items:center;width:14px;height:14px;border:1.5px solid var(--ai);border-radius:50%;font-size:.58rem;font-style:normal;color:var(--ai);line-height:1}
.tk{margin-top:8px;padding-top:8px;border-top:1px dashed rgba(128,128,128,.4);font-size:.82rem}
.tk b{margin-right:8px;color:var(--ai);font-size:.74rem}
.xf{display:flex;align-items:center;gap:8px;margin:11px 0;font-size:.74rem;color:var(--sub)}
.xf::before,.xf::after{content:"";flex:1;height:1px;background:rgba(128,128,128,.35)}
/* day title */
.dh.ht h2{font-size:2.2rem;line-height:1.3;letter-spacing:.04em;margin-top:4px}
.dh h2 small{white-space:nowrap}
@media(max-width:600px){.dh.ht h2{font-size:1.85rem}}
@media(min-width:900px){.dh.ht h2{font-size:2.7rem}}

/* home */
.home{padding-top:30px;min-width:0}
.lc{min-width:0}
.pp{min-width:0}
html,body{overflow-x:clip}
.cd{display:flex;flex-wrap:wrap;align-items:center;gap:22px;padding:22px 24px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r)}
.cn{font-family:var(--head);font-weight:800;font-size:4rem;line-height:1;color:var(--ai);font-variant-numeric:tabular-nums}
.cn small{font-size:1.1rem;font-weight:700;margin-left:6px;color:var(--ink)}
.cl{font-size:.92rem;color:var(--sub);line-height:1.6}
.go2{margin-top:6px;padding:6px 14px;background:var(--ai);color:var(--bg);border:0;border-radius:var(--rs);font:inherit;font-size:.84rem;font-weight:700;cursor:pointer}
.st{font-family:var(--head);font-weight:700;font-size:1.05rem;letter-spacing:.1em;margin:34px 0 12px;display:flex;align-items:center;gap:12px}
.st::after{content:"";flex:1;height:1px;background:var(--line)}
.pp{display:flex;gap:10px}
.pr{flex:1;display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.pr i{flex:none;display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--ai2);color:var(--ai);font-family:var(--head);font-style:normal;font-weight:700}
.pr i{font-size:1.2rem}
.pr i img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.pr span{font-weight:700;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lk{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(230px,100%),1fr))}
.lc{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);color:inherit;text-decoration:none}
.lc:hover{border-color:var(--ai)}
.lc b{flex:none;display:grid;place-items:center;width:38px;height:38px;border-radius:var(--r2);background:var(--ai);color:var(--bg);font-family:var(--head);font-size:1.1rem}
.lc b.ic{background:var(--ai2);color:var(--ai)}
.cd{row-gap:16px}
.cp{flex-basis:100%;display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding-top:14px;border-top:1px dashed var(--line)}
.cp small{color:var(--sub);font-size:.76rem;letter-spacing:.08em;margin-right:2px}
.cm{display:flex;align-items:center;gap:6px;font-size:.86rem;font-weight:700}
.cm i{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--ai2);font-style:normal;font-size:.95rem;overflow:hidden}
.cm i img{width:100%;height:100%;object-fit:cover}
/* 連結：兩欄小卡 */
.lk{grid-template-columns:repeat(2,minmax(0,1fr))}
.lc{gap:10px;padding:12px}
.lc b{width:34px;height:34px}
.lc b svg{width:20px;height:20px}
.lc strong{font-size:.9rem;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lc span{font-size:.72rem;margin-top:1px}
.lc em{display:none}
.lc b svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.lc div{flex:1;min-width:0}
.lc strong{display:block;font-size:1rem}
.lc span{display:block;font-size:.8rem;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lc em{font-style:normal;color:var(--sub)}
.dl{display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
.dc{min-width:0;display:flex;align-items:center;gap:16px;width:100%;padding:14px 16px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);font:inherit;color:inherit;text-align:left;cursor:pointer}
.dc:hover,.dc.today{border-color:var(--ai)}
.dc.today{box-shadow:inset 3px 0 0 var(--shu)}
.dt{flex:none;width:3.6rem;text-align:center;line-height:1.3}
.dt b{display:block;font-family:var(--head);font-size:1.25rem}
.dt span{font-size:.78rem;color:var(--sub)}
.dm{flex:1;min-width:0}
.dm small{display:block;color:var(--shu);font-weight:700;font-size:.74rem;letter-spacing:.1em}
.dm strong{display:block;font-size:1.02rem;line-height:1.5}
.dm span{display:block;font-size:.8rem;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dc i{font-style:normal;color:var(--sub);font-size:1.3rem}
.dw{flex:none;text-align:center;line-height:1.2;font-size:1.25rem}
.dw small{display:block;font-size:.7rem;color:var(--sub);font-variant-numeric:tabular-nums;white-space:nowrap}
.box .v .wm{display:block;font-variant-numeric:tabular-nums}
.box .v .wr{display:inline-block;margin-left:6px;padding:0 5px;font-size:.68rem;font-weight:700;border:1px solid var(--line);border-radius:var(--rs);color:var(--sub);vertical-align:1px}
html[data-theme=diary] .cd,html[data-theme=diary] .pr,html[data-theme=diary] .lc,html[data-theme=diary] .dc{border:1.5px dashed var(--line)}
html[data-theme=diary] .dc:hover,html[data-theme=diary] .dc.today,html[data-theme=diary] .lc:hover{border-color:var(--ai)}
html[data-theme=diary] .cn{text-decoration:underline wavy #ffc83d;text-decoration-thickness:3px;text-underline-offset:8px}
@media(max-width:600px){.cn{font-size:3.2rem}.cd{padding:18px;gap:16px}.pr{padding:8px 10px;gap:8px}.pr i{width:30px;height:30px}}
@media(min-width:900px){nav button.hm i{display:none}}
/* ---- responsive ---- */
html{-webkit-text-size-adjust:100%}
.wrap{padding-left:max(22px,env(safe-area-inset-left));padding-right:max(22px,env(safe-area-inset-right))}
.side{display:contents}
nav button em{display:none}
nav .wrap{scroll-snap-type:x proximity}
nav button{scroll-snap-align:center;min-height:52px}
@media(max-width:600px){
 header{padding-top:calc(env(safe-area-inset-top) + 28px);padding-bottom:18px}
 .vt{font-size:2.5rem}
 .dh{padding-top:26px}
 .dh h2{font-size:2.5rem}
 .pn button{padding:13px 12px}
}
@media(min-width:900px){
 .app{display:grid;grid-template-columns:300px minmax(0,1fr);max-width:1120px;margin:0 auto}
 .side{display:block;position:sticky;top:0;align-self:start;height:100vh;overflow-y:auto;padding-bottom:32px;border-right:1px solid var(--line)}
 .side .wrap{max-width:none;padding:0 20px 0 28px}
 header{padding-top:60px}
 .vt{font-size:3.6rem}
 nav{position:static;background:none;backdrop-filter:none;-webkit-backdrop-filter:none;border:0;padding:0}
 nav .wrap{flex-direction:column;overflow:visible;gap:2px;padding:0 12px 0 0}
 nav button{display:flex;align-items:baseline;gap:12px;text-align:left;width:100%;min-width:0;min-height:0;border-bottom:0;border-left:2px solid transparent;padding:10px 14px}
 nav button:hover{color:var(--ink)}
 nav button[aria-selected=true]{border-left-color:var(--shu);background:var(--paper)}
 nav button em{display:block;order:-1;width:3.4rem;font-style:normal;font-size:.8rem}
 nav button span{font-size:1.15rem}
 nav button i{display:inline;font-size:.82rem}
 .content .wrap{max-width:800px;padding:0 56px}
 .dh{padding-top:60px}
 .dh h2{font-size:3.8rem}
 .pn{display:none}
 ol{margin-top:36px}
}

/* ---- themes ---- */
html[data-theme=snow]{}
html[data-theme=diary]{--bg:#fbf6ea;--paper:#fffdf7;--ink:#3d342b;--sub:#8c7f70;--line:#dccfb3;--ai:#23776c;--ai2:#dff0ea;--hl:#ffe08a;--shu:#d9593d;--shu2:#fde9e2;--head:"Zen Maru Gothic",sans-serif;--body:"Zen Maru Gothic","Noto Sans TC",sans-serif;--r:16px;--r2:10px;--rs:20px}
html[data-theme=diary] body{background-image:radial-gradient(var(--line) 1.1px,transparent 1.3px);background-size:20px 20px}
html[data-theme=diary] .vt{writing-mode:horizontal-tb;font-size:2.5rem;letter-spacing:.06em;text-decoration:underline wavy #ffc83d;text-decoration-thickness:3px;text-underline-offset:9px}
html[data-theme=diary] header .wrap{flex-direction:column;gap:12px}
html[data-theme=diary] .seal{border-radius:50%;transform:rotate(8deg)}
html[data-theme=diary] .dh h2{font-weight:700}
html[data-theme=diary] .dn{display:inline-block;padding:1px 16px;background:repeating-linear-gradient(135deg,#ffe699 0 7px,#fff0bd 7px 14px);color:var(--ink);transform:rotate(-2deg);border-radius:3px;letter-spacing:.14em}
html[data-theme=diary] .box,html[data-theme=diary] .subs,html[data-theme=diary] .hr,html[data-theme=diary] .pn button{border:1.5px dashed var(--line)}
html[data-theme=diary] .tc{border:1.5px dashed var(--ai)}
html[data-theme=diary] .sr{border-bottom:1.5px dashed var(--line)}
html[data-theme=diary] .sr:last-child{border-bottom:0}
html[data-theme=diary] .tr{border-left-style:dashed}
html[data-theme=diary] .rail::before{background:repeating-linear-gradient(to bottom,var(--line) 0 4px,transparent 4px 8px);width:2px;margin-left:-1px}
html[data-theme=diary] .rail::after{width:13px;height:13px;margin-left:-6.5px;top:.4rem;border-width:3px}
/* ---- 現在／下一站（只在旅行當天出現） ---- */
li.past>.t,li.past>.b{opacity:.4}
li.past .rail::after{background:var(--sub)}
li.now .rail::after{background:var(--shu);box-shadow:0 0 0 4px var(--shu2);animation:pulse 2s ease-in-out infinite}
li.next .rail::after{background:var(--paper);border-color:var(--ai)}
li.go.now .rail::after{display:block;width:9px;height:9px;margin-left:-4.5px;top:.5rem}
@keyframes pulse{50%{box-shadow:0 0 0 7px transparent}}
/* 時間軸進度線：已走過的線段變紅 */
li.past .rail::before,html[data-theme=diary] li.past .rail::before{background:var(--shu);opacity:1}
li.now .rail::before,html[data-theme=diary] li.now .rail::before{background:linear-gradient(var(--shu),var(--line) 70%);opacity:1}
li.past .rail::after{background:var(--shu)}
li.go.past .rail::before,li.go.now .rail::before{opacity:.75}
.fade ol>li,.fade .dc{animation:f .38s ease-out both;animation-delay:calc(var(--i,0)*45ms)}
/* 按壓回饋 */
.lc,.dc,.pn button,.go2{transition:transform .12s ease,border-color .15s}
.lc:active,.dc:active,.pn button:active,.go2:active{transform:scale(.97)}
/* 「旅」印章 */
.seal{--rot:-4deg;animation:stamp .55s .25s cubic-bezier(.3,1.6,.5,1) both}
html[data-theme=diary] .seal{--rot:8deg}
@keyframes stamp{0%{opacity:0;transform:scale(2.2) rotate(calc(var(--rot) - 14deg))}55%{opacity:1;transform:scale(.9) rotate(var(--rot))}100%{opacity:1;transform:scale(1) rotate(var(--rot))}}
/* 分頁底線滑動 */
nav .wrap{position:relative}
#ind{position:absolute;bottom:0;height:2px;background:var(--shu);pointer-events:none;transition:left .3s cubic-bezier(.4,0,.2,1),width .3s cubic-bezier(.4,0,.2,1),top .3s cubic-bezier(.4,0,.2,1),height .3s cubic-bezier(.4,0,.2,1)}
nav .wrap.ind button[aria-selected=true]{border-bottom-color:transparent}
@media(min-width:900px){#ind{bottom:auto;width:2px}nav .wrap.ind button[aria-selected=true]{border-left-color:transparent}}
/* 飄雪 */
#snow{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.app{position:relative;z-index:1}
#snow i{position:absolute;top:-12px;border-radius:50%;background:var(--ai);opacity:.16;animation:fall linear infinite}
@media(prefers-color-scheme:dark){html:not([data-theme=diary]) #snow i{background:#fff;opacity:.3}}
html[data-theme=diary] #snow i{background:var(--shu);opacity:.22}
html[data-theme=diary] #snow i:nth-child(3n){background:#ffc83d;opacity:.5}
html[data-theme=diary] #snow i:nth-child(3n+1){background:var(--ai)}
@keyframes fall{to{transform:translate(var(--dx),105vh)}}
@media(prefers-reduced-motion:reduce){li.now .rail::after,.fade ol>li,.fade .dc,.seal,#snow i{animation:none}#snow{display:none}.lc,.dc,.pn button,.go2,#ind{transition:none}}
.nb{display:block;width:max-content;margin:5px 0 0 auto;padding:0 5px;font-family:var(--body);font-size:.66rem;font-weight:700;line-height:1.65;letter-spacing:.04em;border:1px solid;border-radius:var(--rs)}
li.now .nb{background:var(--shu);border-color:var(--shu);color:var(--paper)}
li.next .nb{color:var(--ai);border-color:var(--ai)}
.cl .nx2{display:block;color:var(--ink);font-weight:700}
html[data-theme=diary] .box b{border-radius:50%}
html[data-theme=diary] nav button{border-radius:var(--r2) var(--r2) 0 0}
html[data-theme=diary] nav button[aria-selected=true]{background:var(--hl);border-bottom-color:var(--shu)}
@media(min-width:900px){html[data-theme=diary] nav button{border-radius:var(--r2)}html[data-theme=diary] nav button[aria-selected=true]{border-left-color:var(--shu)}}

/* ---- theme switcher ---- */
#tbtn{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));z-index:20;display:flex;align-items:center;gap:8px;padding:9px 15px;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:30px;font:inherit;font-size:.82rem;font-weight:700;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.12)}
#tbtn i{width:12px;height:12px;border-radius:50%;background:linear-gradient(135deg,var(--ai) 50%,var(--shu) 50%)}
#tpanel{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:calc(max(16px,env(safe-area-inset-bottom)) + 48px);z-index:20;width:min(300px,calc(100vw - 32px));background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:8px;box-shadow:0 8px 28px rgba(0,0,0,.18);display:none}
#tpanel.open{display:block}
#tpanel button{display:flex;align-items:center;gap:12px;width:100%;padding:9px 10px;background:none;border:1.5px solid transparent;border-radius:10px;font:inherit;font-size:.9rem;color:var(--ink);text-align:left;cursor:pointer}
#tpanel button:hover{background:var(--ai2)}
#tpanel button[aria-pressed=true]{border-color:var(--ai)}
#tpanel .sw{display:flex;flex:none;border-radius:20px;overflow:hidden;border:1px solid var(--line)}
#tpanel .sw b{width:18px;height:26px}
#tpanel small{display:block;color:var(--sub);font-size:.72rem;line-height:1.3}
</style>
</head>
<body>
<div class="app"><div class="side"><header><div class="wrap"><h1 class="vt">北海道</h1><div class="hd"><div class="sub">ALGS 行</div><div class="rng" id="range"></div><div class="seal">旅</div></div></div></header>
<nav><div class="wrap" id="tabs" role="tablist"></div></nav></div>
<div class="content"><main class="wrap" id="main"><div class="msg">載入中…</div></main>
<footer><div class="wrap" id="foot"></div></footer></div></div>
<script>
const SHEET_ID = '1NIDiUh2UruCk9V1omryTVxCpa3zkmqO-vBxFlnAEbQ4';
const REFRESH_MS = 60000;
// 若改用「發布到網路」CSV，貼在這裡；留空則用共用連結（gviz）
const PUB = { data: '', days: '' };
// 旅程設定
// icon 放 emoji；想用照片就改成 img:'photos/puff.jpg'（圖片放在同一個 repo）
const TRIP = { year: 2027, travelers: [
  { name:'泡芙', icon:'🧁' },
  { name:'壽司', icon:'🍣' },
  { name:'阿柴', icon:'🐕' }
] };
// 連結圖示：icon 可選 wallet、home、bus、passport、ticket、plane、train、food、link；不填 icon 就改用 mark 的文字
const ICONS = {
  wallet:'<path d="M4 7.5h14.5c.8 0 1.5.7 1.5 1.5v9c0 .8-.7 1.5-1.5 1.5h-13C4.7 19.5 4 18.8 4 18V6.5C4 5.7 4.7 5 5.5 5H16"/><path d="M20 11.5h-3.5a1.5 1.5 0 0 0 0 3H20"/>',
  home:'<path d="M3.5 11 12 4l8.5 7"/><path d="M6 9.5V20h12V9.5"/><path d="M10 20v-5.5h4V20"/>',
  bus:'<rect x="5" y="3.5" width="14" height="14" rx="2.5"/><path d="M5 11h14M9.5 6.5h5M7.5 17.5V20M16.5 17.5V20"/><circle cx="8.5" cy="14.3" r=".4"/><circle cx="15.5" cy="14.3" r=".4"/>',
  passport:'<rect x="5.5" y="3" width="13" height="18" rx="1.8"/><circle cx="12" cy="10.5" r="3.2"/><path d="M8.8 10.5h6.4M9 16.5h6"/>',
  ticket:'<path d="M4 8V6.5h16V8a2 2 0 0 0 0 4v1.5a2 2 0 0 0 0 4V17.5H4V16a2 2 0 0 0 0-4V12a2 2 0 0 0 0-4z"/><path d="M14 7v11" stroke-dasharray="1.5 2"/>',
  plane:'<path d="M10.5 13.5 4 11l1.5-1.5 7 1 3.5-3.5c.8-.8 2.2-.8 2.5 0 .3.3.2 1.7-.5 2.5L14.5 13l1 7L14 21.5l-2.5-6.5-3 3V20l-1.5 1-1-3.5-3.5-1 1-1.5h2l3-3"/>',
  train:'<rect x="6" y="3.5" width="12" height="13" rx="3"/><path d="M6 10h12M9 20l1.5-3.5M15 20l-1.5-3.5"/><circle cx="9.3" cy="13.3" r=".4"/><circle cx="14.7" cy="13.3" r=".4"/>',
  food:'<path d="M7 3.5v17M4.5 3.5V8a2.5 2.5 0 0 0 5 0V3.5M16.5 20.5v-17c-2 0-3.5 2.5-3.5 6v4.5h3.5"/>',
  link:'<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>'
};
const LINKS = [
  { icon:'passport', title:'入境', hint:'Visit Japan Web', url:'https://www.vjw.digital.go.jp/' },
  { icon:'wallet', title:'分帳', hint:'LINE 群組帳本', url:'https://liff.line.me/1655320992-Y8GowEpw/g/fdwciSqUo4jXdyMUK4WteR' },
  { icon:'bus', title:'一日遊', hint:'旭山・青池', url:'https://www.klook.com/zh-TW/activity/105219-asahikawa-zoo-ningle-terrace-shirahige-waterfall-day-tour-private-tour-sapporo/?package_id=669416' },
  { icon:'home', title:'住宿', hint:'Airbnb', hotel:true, url:'https://www.airbnb.com.tw/rooms/1270601487447971191' }
];
// 天氣：試算表 days 分頁的 city 欄填城市名稱，對應這裡的座標
// 不在表裡的城市會自動用名稱查座標；也可以直接在 city 欄填「43.06,141.35」
const CITY = {
  '札幌':[43.0618,141.3545], '旭川':[43.7706,142.3650], '小樽':[43.1907,140.9947],
  '美瑛':[43.5883,142.4670], '富良野':[43.3420,142.3832], '千歲':[42.8210,141.6510],
  '新千歲':[42.7752,141.6923], '層雲峽':[43.7222,142.9500], '函館':[41.7687,140.7288],
  '登別':[42.4128,141.1067], '洞爺':[42.5667,140.8167], '二世谷':[42.8048,140.6874]
};
const WX_KEY='algs-wx', WX_MS=3600000;
const gviz = n => `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&headers=1&sheet=${encodeURIComponent(n)}`;
const src = n => PUB[n] ? PUB[n] + (PUB[n].includes('?') ? '&' : '?') + 't=' + Date.now() : gviz(n);

function parseCSV(t){
  const rows=[];let r=[],c='',q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch=='"')q=true;
    else if(ch==','){r.push(c);c=''}
    else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;r.push(c);rows.push(r);r=[];c=''}
    else c+=ch}
  if(c||r.length){r.push(c);rows.push(r)}
  const h=rows.shift().map(s=>s.trim());
  return rows.filter(x=>x.some(v=>v.trim())).map(x=>Object.fromEntries(h.map((k,i)=>[k,(x[i]||'').trim()])));
}
async function get(name){
  let why1='';
  try{const r=await fetch(src(name),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);
    const t=await r.text();if(/^\s*<(!doctype|html)/i.test(t))throw new Error('回傳的是登入頁（試算表未公開）');return parseCSV(t)}
  catch(e){why1=e.message}
  try{const r=await fetch(name+'.csv',{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);return parseCSV(await r.text())}
  catch(e){throw new Error(`${name}：Google Sheet 失敗（${why1}）；本機 ${name}.csv 失敗（${e.message}）`)}
}
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mapUrl = it => {
  if(it.map==='-'||!it.place) return '';
  if(/^https?:/.test(it.map)) return it.map;
  return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(it.map||`${it.place} ${it.region}`);
};
const wk = md => {
  const [m,d]=(md||'').split('/').map(Number);if(!m||!d)return '';
  return '日月火水木金土'[new Date(TRIP.year,m-1,d).getDay()];
};
const dateOf = md => {const [m,d]=(md||'').split('/').map(Number);return m&&d?new Date(TRIP.year,m-1,d):null};
// 「現在」一律用日本時間；測試可在網址加 ?now=2027-02-10T10:30
function nowJST(){
  const q=new URLSearchParams(location.search).get('now'),m=q&&q.match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:[T ](\d{1,2}):(\d{2}))?/);
  if(m)return{y:+m[1],m:+m[2],d:+m[3],min:(+m[4]||0)*60+(+m[5]||0)};
  const p=Object.fromEntries(new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Tokyo',year:'numeric',month:'numeric',day:'numeric',hour:'numeric',minute:'numeric',hourCycle:'h23'}).formatToParts(new Date()).map(x=>[x.type,x.value]));
  return{y:+p.year,m:+p.month,d:+p.day,min:+p.hour*60+(+p.minute)};
}
const isToday=(md,n)=>{const [m,d]=(md||'').split('/').map(Number);return n.y===TRIP.year&&m===n.m&&d===n.d};
const toMin=s=>{const m=String(s||'').replace(/：/g,':').match(/(\d{1,2}):(\d{2})/);return m?+m[1]*60+(+m[2]):null};
const gTime=g=>g.legs?(g.legs.find(l=>l.time)||{}).time:g.it.time;
// 只有「今天」那一頁會回傳進度；其他日子（含旅程結束後）維持原樣
function progress(day,groups){
  const n=nowJST();if(!isToday(day.date,n))return null;
  const ts=groups.map(g=>toMin(gTime(g)));
  let cur=-1;ts.forEach((t,i)=>{if(t!=null&&t<=n.min)cur=i});
  return{cur,next:ts.findIndex((t,i)=>i>cur&&t!=null)};
}
const gState=(p,i)=>!p?'':i===p.cur?'now':i===p.next?'next':i<p.cur?'past':'';
const BADGE={now:'進行中',next:'下一站'};
const badge=st=>BADGE[st]?`<span class="nb">${BADGE[st]}</span>`:'';
const gName=g=>g.legs?g.legs.map(l=>[l.mode,l.line].filter(Boolean).join(' ')).join(' → '):(g.it.place||g.it.detail||'');
/* ---- 天氣（Open-Meteo，免金鑰，最多 16 天預報） ---- */
const WMO=c=>c===0?['☀️','晴']:c===1?['🌤️','晴時多雲']:c===2?['⛅','多雲']:c===3?['☁️','陰']:c<=48?['🌫️','霧']:c<=57?['🌦️','毛毛雨']:c<=65?['🌧️','雨']:c<=67?['🌧️','凍雨']:c<=77?['❄️','雪']:c<=82?['🌦️','陣雨']:c<=86?['🌨️','陣雪']:['⛈️','雷雨'];
const isSnow=w=>(w.code>=71&&w.code<=77)||w.code===85||w.code===86||w.snow>0;
let wx={};try{wx=JSON.parse(localStorage.getItem(WX_KEY)||'{}').data||{}}catch(e){}
const isoOf=md=>{const [m,d]=(md||'').split('/').map(Number);return m&&d?`${TRIP.year}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`:''};
const daysAhead=md=>{const n=nowJST(),t=dateOf(md);return t?Math.round((t-new Date(n.y,n.m-1,n.d))/864e5):null};
// 只在「今天到 15 天後」之間顯示預報；已過的日子與旅程結束後維持手動內容
function wxOf(day){
  const a=daysAhead(day.date);if(!day.city||a==null||a<0||a>15)return null;
  return (wx[day.city]||{})[isoOf(day.date)]||null;
}
async function coordOf(c){
  const m=c.match(/^\s*(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)\s*$/);if(m)return[+m[1],+m[2]];
  if(CITY[c])return CITY[c];
  const r=await fetch('https://geocoding-api.open-meteo.com/v1/search?count=1&language=ja&countryCode=JP&name='+encodeURIComponent(c));
  const g=(await r.json()).results?.[0];if(!g)throw new Error('找不到城市 '+c);return[g.latitude,g.longitude];
}
let wxBusy=false;
async function loadWx(){
  if(wxBusy)return;
  const want=days.filter(d=>d.city&&(a=>a!=null&&a>=0&&a<=15)(daysAhead(d.date)));
  if(!want.length)return;
  let saved={};try{saved=JSON.parse(localStorage.getItem(WX_KEY)||'{}')}catch(e){}
  const cities=[...new Set(want.map(d=>d.city))];
  if(saved.t&&Date.now()-saved.t<WX_MS&&cities.every(c=>saved.data&&saved.data[c]))return;
  const data={};wxBusy=true;
  await Promise.all(cities.map(async c=>{
    try{
      const [lat,lon]=await coordOf(c);
      const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&timezone=Asia%2FTokyo&forecast_days=16&daily=weather_code,temperature_2m_max,temperature_2m_min,apparent_temperature_max,apparent_temperature_min,precipitation_probability_max,snowfall_sum`);
      const j=(await r.json()).daily;data[c]={};
      j.time.forEach((t,i)=>data[c][t]={code:j.weather_code[i],hi:j.temperature_2m_max[i],lo:j.temperature_2m_min[i],fhi:j.apparent_temperature_max[i],flo:j.apparent_temperature_min[i],pop:j.precipitation_probability_max[i],snow:j.snowfall_sum[i]});
    }catch(e){console.warn('天氣',c,e);data[c]=saved.data?.[c]||{}}
  }));wxBusy=false;
  wx=data;try{localStorage.setItem(WX_KEY,JSON.stringify({t:Date.now(),data}))}catch(e){}
  const y=scrollY;render(false);scrollTo(0,y);
}
const deg=v=>v==null?'–':Math.round(v)+'°';
function wxBox(day){
  const w=wxOf(day);if(!w)return '';
  const [ic,tx]=WMO(w.code);
  const h=`<strong>${ic} ${tx}　${deg(w.lo)} / ${deg(w.hi)}${daysAhead(day.date)>7?'<span class="wr">參考</span>':''}</strong>`+
      `<span class="wm">體感 ${deg(w.flo)} / ${deg(w.fhi)}${w.pop!=null?`　${isSnow(w)?'降雪':'降雨'}機率 ${w.pop}%`:''}</span>`;
  return `<div class="box"><b>天</b><div class="v">${h}</div></div>`;
}
const label = d => /^\d+$/.test(d.day)?d.day+'日目':d.day;
const CLOCK='<svg viewBox="0 0 16 16"><path d="M8 0a8 8 0 1 0 0 16A8 8 0 0 0 8 0zm0 14.2A6.2 6.2 0 1 1 8 1.8a6.2 6.2 0 0 1 0 12.4zM8.9 4H7.4v4.6l3.6 2.2.8-1.2-2.9-1.7z"/></svg>';
const PIN='<svg viewBox="0 0 16 16"><path d="M8 0a5.5 5.5 0 0 0-5.5 5.5C2.5 9.6 8 16 8 16s5.5-6.4 5.5-10.5A5.5 5.5 0 0 0 8 0zm0 7.6a2.1 2.1 0 1 1 0-4.2 2.1 2.1 0 0 1 0 4.2z"/></svg>';

let days=[],cur=location.hash.slice(1)?decodeURIComponent(location.hash.slice(1)):'';

function build(d,it){
  const map=new Map();
  d.forEach(x=>map.set(x.day,{...x,items:[]}));
  it.forEach(x=>{if(!map.has(x.day))map.set(x.day,{day:x.day,date:x.date,items:[]});map.get(x.day).items.push(x)});
  days=[...map.values()];
}
function pickDefault(){
  if(cur==='home'||days.some(d=>d.day===cur))return;
  cur='home';
}
const isSub=it=>/^(y|yes|是|v|1|true)$/i.test(it.sub||'');
function subHTML(s){
  const u=mapUrl(s),nm=s.place||s.detail;
  const name=u?`<a class="n1" href="${esc(u)}" target="_blank" rel="noopener">${esc(nm)}</a>`:esc(nm);
  return `<div class="sr"><div class="sn"><div class="nm">${name}</div>`+(s.place&&s.detail?`<div class="sd">${esc(s.detail)}</div>`:'')+(s.note?`<div class="sd">${esc(s.note)}</div>`:'')+`</div>`+
    (s.hours?`<div class="sh">${CLOCK}${esc(s.hours)}</div>`:'')+
    (u?`<a class="mp" href="${esc(u)}" target="_blank" rel="noopener" aria-label="在 Google 地圖開啟 ${esc(nm)}">${PIN}</a>`:'')+`</div>`;
}
function itemHTML(it,subs=[],ps=''){
  const url=mapUrl(it), title=it.place||it.detail, detail=it.place?it.detail:'';
  const st=it.status?`<span class="s ${it.status==='已預訂'?'ok':'no'}">${esc(it.status)}</span>`:'';
  const t=url?`<a class="n1" href="${esc(url)}" target="_blank" rel="noopener">${esc(title)}</a><a class="pin" href="${esc(url)}" target="_blank" rel="noopener" aria-label="在 Google 地圖開啟 ${esc(title)}">${PIN}地圖</a>`:esc(title);
  return `<li class="${it.place||subs.length?'':'plain'} ${ps}"${ps==='now'||ps==='next'?` id="mk-${ps}"`:''}><div class="t">${esc(it.time)}${badge(ps)}</div><div class="rail"></div><div class="b"><div class="title">${t}${st}</div>`+
    (it.hours?`<div class="hr">${CLOCK}營業 ${esc(it.hours)}</div>`:'')+
    (detail?`<div class="d">${esc(detail)}</div>`:'')+
    (it.transport?`<div class="tr">${esc(it.transport)}</div>`:'')+
    (it.note?`<div class="n">${esc(it.note)}</div>`:'')+(subs.length?`<div class="subs">${subs.map(subHTML).join('')}</div>`:'')+`</div></li>`;
}
function transitHTML(legs,st=''){
  const t=(legs.find(l=>l.time)||{}).time||'';
  const body=legs.map(l=>`<div class="leg"><div class="lh"><span class="md">${esc(l.mode)}</span>${l.line?`<b class="ln">${esc(l.line)}</b>`:''}${l.status?`<span class="s ${l.status==='已預訂'?'ok':'no'}">${esc(l.status)}</span>`:''}</div>`+
    (l.detail?`<div class="rt">${esc(l.detail)}</div>`:'')+
    ((l.ride||l.fare)?`<div class="mt">${l.ride?`<span>${CLOCK}${esc(l.ride)}</span>`:''}${l.fare?`<span><i class="fy">¥</i>${esc(l.fare)}</span>`:''}</div>`:'')+
    (l.ticket?`<div class="tk"><b>購票</b>${esc(l.ticket)}</div>`:'')+
    (l.note?`<div class="sd">${esc(l.note)}</div>`:'')+`</div>`).join('<div class="xf">轉乘</div>');
  return `<li class="go ${st}"${st==='now'||st==='next'?` id="mk-${st}"`:''}><div class="t">${esc(t)}${badge(st)}</div><div class="rail"></div><div class="b"><div class="tc">${body}</div></div></li>`;
}
function groupItems(items){
  const g=[];
  items.forEach(it=>{
    const last=g[g.length-1];
    if(it.mode){if(last&&last.legs)last.legs.push(it);else g.push({legs:[it]})}
    else if(isSub(it)&&last&&last.it)last.subs.push(it);
    else g.push({it,subs:[]});
  });
  return g;
}
const order=()=>['home',...days.map(d=>d.day)];
let indPos=null,countDone=false;
function moveInd(){
  const w=document.getElementById('tabs'),b=w.querySelector('[aria-selected=true]');if(!b)return;
  let el=document.getElementById('ind');if(!el){el=document.createElement('span');el.id='ind';w.append(el);w.classList.add('ind')}
  const desk=matchMedia('(min-width:900px)').matches;
  const to=desk?{left:b.offsetLeft,top:b.offsetTop,width:2,height:b.offsetHeight}:{left:b.offsetLeft,top:b.offsetTop+b.offsetHeight-2,width:b.offsetWidth,height:2};
  const from=indPos||to;
  Object.assign(el.style,{transition:'none',left:from.left+'px',top:from.top+'px',width:from.width+'px',height:from.height+'px'});
  el.offsetWidth;el.style.transition='';
  Object.assign(el.style,{left:to.left+'px',top:to.top+'px',width:to.width+'px',height:to.height+'px'});indPos=to;
}
addEventListener('resize',()=>{indPos=null;moveInd()});
document.fonts?.ready.then(()=>{indPos=null;moveInd()});
function renderTabs(){
  document.getElementById('tabs').innerHTML=`<button role="tab" class="hm" data-day="home" aria-selected="${cur==='home'}"><span>首頁</span><i>旅程</i><em>總覽</em></button>`+days.map(d=>
    `<button role="tab" data-day="${esc(d.day)}" aria-selected="${d.day===cur}"><span>${esc(d.date||'')}</span><i>${esc(wk(d.date)||label(d))}</i><em>${esc(label(d))}</em></button>`).join('');
  const dates=days.filter(d=>d.day!=='備用').map(d=>d.date);
  document.getElementById('range').textContent=dates.length?`${dates[0]} – ${dates[dates.length-1]}`:'';
  moveInd();
}
const summary=d=>{const p=[...new Set(d.items.filter(i=>i.place&&!i.mode).map(i=>i.place.replace(/\s*\(.*\)$/,'')))];return p.slice(0,3).join('、')+(p.length>3?'…':'')};
function renderHome(animate){
  const real=days.filter(d=>/^\d+$/.test(d.day));
  const n=nowJST(),t0=new Date(n.y,n.m-1,n.d);
  const start=dateOf(real[0]?.date),end=dateOf(real[real.length-1]?.date);
  const todayDay=real.find(d=>isToday(d.date,n));
  let cd='';
  if(start&&end){
    const diff=Math.round((start-t0)/864e5);
    if(diff>0)cd=`<div class="cd"><div class="cn"><span class="cu" data-n="${diff}">${diff}</span><small>天</small></div><div class="cl">距離出發<br>${esc(real[0].date)}（${wk(real[0].date)}）</div></div>`;
    else if(t0<=end&&todayDay){
      const g=groupItems(todayDay.items),p=progress(todayDay,g),x=p&&(p.next>=0?g[p.next]:g[p.cur]);
      const nx=x?`<span class="nx2">${p.next>=0?'下一站':'進行中'}　${esc(gTime(x)||'')} ${esc(gName(x))}</span>`:'';
      cd=`<div class="cd"><div class="cn">${-diff+1}<small>日目</small></div><div class="cl">旅行中${nx?'':'<br>'}${nx}<button class="go2" data-day="${esc(todayDay.day)}">看今天行程 ›</button></div></div>`;}
    else if(t0<=end)cd=`<div class="cd"><div class="cn">旅行中</div></div>`;
    else cd=`<div class="cd"><div class="cn" style="font-size:1.8rem">旅程結束</div><div class="cl">謝謝大家，辛苦了</div></div>`;
  }
  // 同行者放在倒數卡片底部
  const pp=TRIP.travelers.map(x=>`<div class="cm"><i>${x.img?`<img src="${esc(x.img)}" alt="">`:esc(x.icon||[...x.name][0])}</i><span>${esc(x.name)}</span></div>`).join('');
  const ppRow=`<div class="cp"><small>同行 ${TRIP.travelers.length} 人</small>${pp}</div>`;
  cd=cd?cd.replace(/<\/div>$/,ppRow+'</div>'):`<div class="cd">${ppRow}</div>`;
  const hd=days.find(d=>d.hotel);
  const links=LINKS.map(l=>l.hotel&&hd?{...l,hint:hd.hotel}:l);
  const lk=links.map(l=>`<a class="lc" href="${esc(l.url)}" target="_blank" rel="noopener">${ICONS[l.icon]?`<b class="ic"><svg viewBox="0 0 24 24">${ICONS[l.icon]}</svg></b>`:`<b>${esc(l.mark||'')}</b>`}<div><strong>${esc(l.title)}</strong><span>${esc(l.hint)}</span></div><em>↗</em></a>`).join('');
  const dl=days.map(d=>{
    const sm=summary(d);
    return `<button class="dc${todayDay&&todayDay.day===d.day?' today':''}" data-day="${esc(d.day)}"><div class="dt"><b>${esc(d.date||'')}</b><span>${esc(wk(d.date))}</span></div><div class="dm"><small>${esc(label(d))}</small><strong>${esc(d.title||sm||'行程')}</strong>${d.title&&sm?`<span>${esc(sm)}</span>`:''}</div>${(w=>w?`<span class="dw">${WMO(w.code)[0]}<small>${deg(w.lo)}/${deg(w.hi)}</small></span>`:'')(wxOf(d))}<i>›</i></button>`}).join('');
  document.getElementById('main').innerHTML=`<div class="home${animate?' fade':''}">${cd}<h3 class="st">連結</h3><div class="lk">${lk}</div><h3 class="st">行程一覽</h3><div class="dl">${dl}</div></div>`;
  document.title='北海道 ALGS 行';
  const cu=document.querySelector('.cu');
  if(cu&&!countDone&&!matchMedia('(prefers-reduced-motion:reduce)').matches){
    countDone=true;const n=+cu.dataset.n,t0=performance.now();
    const step=t=>{const k=Math.min(1,(t-t0)/800);cu.textContent=Math.round(n*(1-Math.pow(1-k,3)));if(k<1&&cu.isConnected)requestAnimationFrame(step)};
    cu.textContent='0';requestAnimationFrame(step);
  }
}
function render(animate){
  pickDefault();renderTabs();
  if(cur==='home'){renderHome(animate);return}
  const idx=days.findIndex(d=>d.day===cur), day=days[idx];
  const info=[];
  const wb=wxBox(day);if(wb)info.push(wb);
  if(day.hotel)info.push(`<div class="box"><b>宿</b><div class="v"><strong>${esc(day.hotel)}</strong>${day.hotel_note?`<span>${esc(day.hotel_note)}</span>`:''}</div></div>`);
  const groups=groupItems(day.items),pg=progress(day,groups);
  const prev=idx>0?days[idx-1]:{day:'home',date:'首頁'},next=days[idx+1];
  document.getElementById('main').innerHTML=`<div class="${animate?'fade':''}"><div class="dh${day.title?' ht':''}"><div class="dn">${esc(label(day))}</div>`+
    (day.title?`<h2>${esc(day.title)}<small>${esc(day.date||'')}　${esc(wk(day.date))}</small></h2>`:`<h2>${esc(day.date||'')}<small>${esc(wk(day.date))}</small></h2>`)+
    (info.length?`<div class="info">${info.join('')}</div>`:'')+`</div><ol>${groups.map((g,i)=>g.legs?transitHTML(g.legs,gState(pg,i)):itemHTML(g.it,g.subs,gState(pg,i))).join('')}</ol>`+
    `<div class="pn">${prev?`<button data-day="${esc(prev.day)}">‹ ${esc(prev.date)}</button>`:''}${next?`<button class="nx" data-day="${esc(next.day)}">${esc(next.date)} ›</button>`:''}</div></div>`;
  document.title=`${label(day)} ${day.title||day.date} ｜ 北海道 ALGS 行`;
}
const toMark=()=>(document.getElementById('mk-now')||document.getElementById('mk-next'))?.scrollIntoView({block:'center'});
const stagger=()=>document.querySelectorAll('#main .fade ol>li,#main .fade .dc').forEach((el,i)=>el.style.setProperty('--i',Math.min(i,12)));
function go(d){
  if(!d||d===cur)return;
  cur=d;history.replaceState(null,'','#'+encodeURIComponent(cur));
  render(true);stagger();scrollTo({top:0});toMark();
  document.querySelector('#tabs [aria-selected=true]')?.scrollIntoView({inline:'center',block:'nearest'});
}
document.addEventListener('click',e=>{const b=e.target.closest('button[data-day]');if(b)go(b.dataset.day)});
document.addEventListener('keydown',e=>{
  if(e.target.closest('input,textarea'))return;
  const o=order(),i=o.indexOf(cur);
  if(e.key==='ArrowLeft'&&o[i-1])go(o[i-1]);
  if(e.key==='ArrowRight'&&o[i+1])go(o[i+1]);
});
let sx=0,sy=0;
document.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
document.addEventListener('touchend',e=>{
  if(e.target.closest('nav,.tr'))return;
  const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)<70||Math.abs(dy)>45)return;
  const o=order(),i=o.indexOf(cur);
  go(dx<0?o[i+1]:o[i-1]);
},{passive:true});

async function load(){
  try{
    const [d,it]=await Promise.all([get('days'),get('data')]);
    build(d,it);
    const first=!window.__r;window.__r=1;
    const y=scrollY;render(false);if(!first)scrollTo(0,y);else toMark();
    loadWx().catch(e=>console.warn('天氣',e));
    document.getElementById('foot').textContent='資料每分鐘自動更新｜最後更新 '+new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'});
  }catch(e){
    if(days.length){const y=scrollY;render(false);scrollTo(0,y)}
    if(!days.length)document.getElementById('main').innerHTML='<div class="msg">讀取不到資料。請確認試算表已設為「知道連結的人可檢視」，且分頁名稱為 data 與 days。<br><small>'+esc(e.message)+'</small></div>';
  }
}

/* ---- theme switcher ---- */
const THEMES=[
 ['snow','雪白','日系簡約・明朝體・自動深色','#f6f8f8','#27415f','#b4452f'],
 ['diary','手帳','可愛手帳・圓體・點點紙','#fbf6ea','#23776c','#ffd166']
];
function setTheme(id){
  document.documentElement.dataset.theme=id;
  try{localStorage.setItem('theme',id)}catch(e){}
  document.querySelectorAll('#tpanel button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.t===id));
}
if(SHOW_SWITCHER){
  const p=document.createElement('div');p.id='tpanel';
  p.innerHTML=THEMES.map(t=>`<button data-t="${t[0]}" aria-pressed="false"><span class="sw"><b style="background:${t[3]}"></b><b style="background:${t[4]}"></b><b style="background:${t[5]}"></b></span><span>${t[1]}<small>${t[2]}</small></span></button>`).join('');
  const b=document.createElement('button');b.id='tbtn';b.innerHTML='<i></i>配色';
  b.onclick=()=>p.classList.toggle('open');
  p.onclick=e=>{const x=e.target.closest('button');if(x)setTheme(x.dataset.t)};
  document.addEventListener('click',e=>{if(!e.target.closest('#tpanel,#tbtn'))p.classList.remove('open')});
  document.body.append(p,b);setTheme(document.documentElement.dataset.theme);
}
/* ---- 飄雪 ---- */
(()=>{const sn=document.createElement('div');sn.id='snow';sn.setAttribute('aria-hidden','true');
  sn.innerHTML=Array.from({length:22},()=>{const z=(2+Math.random()*4).toFixed(1),d=(10+Math.random()*12).toFixed(1);
    return `<i style="left:${(Math.random()*100).toFixed(1)}%;width:${z}px;height:${z}px;--dx:${Math.round(Math.random()*80-40)}px;animation-duration:${d}s;animation-delay:-${(Math.random()*d).toFixed(1)}s"></i>`}).join('');
  document.body.prepend(sn)})();
load();setInterval(load,REFRESH_MS);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});
</script>
