<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>北海道 ALGS 行</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<script>
const DEFAULT_THEME='snow', SHOW_SWITCHER=true;
(function(){let t=new URLSearchParams(location.search).get('theme');try{t=t||localStorage.getItem('theme')}catch(e){}
document.documentElement.dataset.theme=t||DEFAULT_THEME})();
</script>
<style>
:root{--bg:#f6f8f8;--paper:#fff;--ink:#1f2226;--sub:#7a8087;--line:#dde2e4;--ai:#27415f;--ai2:#e7edf3;--shu:#b4452f;--shu2:#f8ebe7;--head:"Shippori Mincho",serif;--body:"Zen Kaku Gothic New","Noto Sans TC",sans-serif;--r:6px;--r2:4px;--rs:3px}
@media(prefers-color-scheme:dark){:root{--bg:#14171a;--paper:#1b1f23;--ink:#e9ecee;--sub:#8e969d;--line:#2d3338;--ai:#93b4da;--ai2:#202a35;--shu:#e8836b;--shu2:#2b1f1c}}
*{box-sizing:border-box}
html{scroll-padding-top:90px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.75;padding-bottom:env(safe-area-inset-bottom)}
.wrap{max-width:680px;margin:0 auto;padding:0 22px}
.serif{font-family:var(--head)}

header{padding:calc(env(safe-area-inset-top) + 44px) 0 26px}
header .wrap{display:flex;gap:22px;align-items:flex-start}
.vt{writing-mode:vertical-rl;font-family:var(--head);font-weight:800;font-size:3.4rem;line-height:1;letter-spacing:.18em;margin:0;color:var(--ink)}
.hd{padding-top:6px}
.hd .sub{font-family:var(--head);font-weight:500;font-size:1.15rem;letter-spacing:.2em}
.hd .rng{color:var(--sub);font-size:.9rem;margin-top:6px;letter-spacing:.08em}
.seal{display:inline-grid;place-items:center;width:2.1rem;height:2.1rem;margin-top:16px;background:var(--shu);color:#fff;font-family:var(--head);font-weight:700;font-size:1.05rem;border-radius:var(--rs);transform:rotate(-4deg)}

nav{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
nav .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav button{flex:none;min-width:58px;background:none;border:0;border-bottom:2px solid transparent;padding:11px 8px 9px;font:inherit;color:var(--sub);cursor:pointer;text-align:center;line-height:1.35;transition:color .15s,border-color .15s}
nav button i{display:block;font-style:normal;font-size:.7rem}
nav button span{display:block;font-family:var(--head);font-weight:700;font-size:1.1rem;color:inherit}
nav button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--shu)}
nav button:focus-visible,a:focus-visible{outline:2px solid var(--ai);outline-offset:2px;border-radius:2px}

main{padding-bottom:30px}
.fade{animation:f .22s ease-out}
@keyframes f{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.fade{animation:none}nav button{transition:none}}

.dh{padding:34px 0 6px}
.dn{color:var(--shu);font-weight:700;font-size:.9rem;letter-spacing:.12em}
.dh h2{font-family:var(--head);font-weight:800;font-size:3.1rem;line-height:1.15;margin:2px 0 0;letter-spacing:.02em}
.dh h2 small{font-size:1.05rem;font-weight:500;color:var(--sub);margin-left:12px;letter-spacing:.1em}
.info{margin-top:16px;display:grid;gap:8px}
.box{display:grid;grid-template-columns:auto 1fr;gap:12px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;font-size:.88rem}
.box b{display:grid;place-items:center;width:1.7rem;height:1.7rem;border:1.5px solid var(--shu);color:var(--shu);border-radius:var(--r2);font-family:var(--head);font-size:.9rem;line-height:1}
.box .v{white-space:pre-wrap}
.box .v strong{display:block;font-weight:700;font-size:.95rem}
.box .v span{color:var(--sub)}

ol{list-style:none;margin:30px 0 0;padding:0}
li{display:grid;grid-template-columns:3.4rem 22px 1fr}
.t{text-align:right;padding-bottom:28px;font-family:var(--head);font-weight:700;font-size:1.02rem;line-height:1.5;padding-top:1px;font-variant-numeric:tabular-nums}
.t:empty::after{content:"";}
.rail{position:relative}
.rail::before{content:"";position:absolute;left:50%;top:.85rem;bottom:0;width:1px;background:var(--line)}
.rail::after{content:"";position:absolute;left:50%;top:.45rem;width:11px;height:11px;margin-left:-5.5px;border-radius:50%;background:var(--ai);border:2px solid var(--bg)}
li:last-child .rail::before{display:none}
li.plain .rail::after{width:7px;height:7px;margin-left:-3.5px;top:.62rem;background:var(--bg);border:1.5px solid var(--sub)}
.b{padding:0 0 28px 8px;min-width:0}
.title{font-weight:700;font-size:1.06rem;line-height:1.5}
li.plain .title{font-weight:500;color:var(--sub);font-size:.98rem}
a.n1,a.n1:visited{color:inherit;text-decoration:none;background:linear-gradient(var(--ai2),var(--ai2)) 0 100%/100% .45em no-repeat;transition:background-size .15s}
a.n1:hover{background-size:100% 100%}
.pin{display:inline-flex;align-items:center;gap:3px;margin-left:8px;padding:0 8px;border:1px solid var(--line);border-radius:20px;font-size:.72rem;font-weight:500;color:var(--ai);text-decoration:none;vertical-align:2px;white-space:nowrap}
.pin:hover{background:var(--ai2)}
.pin svg{width:10px;height:10px;fill:currentColor}
.d{font-size:.93rem;white-space:pre-wrap;margin-top:1px}
.tr{margin-top:10px;padding:10px 12px;background:var(--ai2);border-radius:var(--r2);border-left:3px solid var(--ai);font-size:.84rem;white-space:pre-wrap}
.n{margin-top:7px;font-size:.82rem;color:var(--sub);white-space:pre-wrap}
.s{display:inline-block;margin-left:8px;padding:0 6px;font-size:.7rem;font-weight:700;border:1px solid;border-radius:var(--rs);line-height:1.5;vertical-align:2px;letter-spacing:.04em}
.s.ok{color:var(--ai);border-color:var(--ai)}
.s.no{color:var(--shu);border-color:var(--shu);background:var(--shu2)}
.msg{padding:70px 0;color:var(--sub);text-align:center;font-size:.92rem}
.pn{display:flex;justify-content:space-between;gap:12px;padding:6px 0 4px}
.pn button{flex:1;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;font:inherit;font-size:.85rem;color:var(--ink);cursor:pointer}
.pn button:hover{border-color:var(--ai)}
.pn button:only-child{max-width:50%}
.pn .nx{margin-left:auto}
footer{padding:22px 0 44px;font-size:.76rem;color:var(--sub);text-align:center}
@media(max-width:430px){.vt{font-size:2.8rem}.dh h2{font-size:2.6rem}li{grid-template-columns:3rem 20px 1fr}}


/* optional places + business hours */
.hr{display:inline-flex;align-items:center;gap:6px;margin:7px 0 3px;padding:2px 11px 2px 9px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r2);font-weight:700;font-size:.9rem;font-variant-numeric:tabular-nums}
.hr svg{width:12px;height:12px;fill:var(--ai)}
.subs{margin-top:12px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:2px 14px}
.sr{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:11px 0;border-bottom:1px solid var(--line)}
.sr:last-child{border-bottom:0}
.sn{min-width:0}
.sn .nm{font-weight:500;font-size:.93rem;line-height:1.5}
.sd{font-size:.8rem;color:var(--sub);white-space:pre-wrap}
.subs a.n1,.subs a.n1:visited{background:none;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:4px;text-decoration-thickness:1.5px}
.subs a.n1:hover{text-decoration-color:var(--ai)}
.sh{flex:none;display:inline-flex;align-items:center;gap:5px;padding:2px 9px;background:var(--ai2);border-radius:var(--r2);font-weight:700;font-size:.84rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.sh svg{width:11px;height:11px;fill:var(--ai)}

/* transit */
li.go .rail::after{display:none}
li.go .rail::before{top:0;background:repeating-linear-gradient(to bottom,var(--sub) 0 3px,transparent 3px 7px);opacity:.45}
li.go .t{font-size:.82rem;color:var(--sub);font-weight:500}
li.go .b{padding-bottom:22px;margin-top:-14px}
.tc{background:var(--ai2);border-radius:var(--r2);padding:11px 13px}
.lh{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.lh .s{margin-left:0}
.md{padding:0 8px;border-radius:var(--rs);background:var(--ai);color:var(--bg);font-size:.72rem;font-weight:700;line-height:1.65}
.ln{font-size:.95rem}
.rt{margin-top:3px;font-size:.85rem}
.mt{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:6px;font-size:.85rem;font-weight:700;font-variant-numeric:tabular-nums}
.mt span{display:inline-flex;align-items:center;gap:5px}
.mt svg{width:12px;height:12px;fill:var(--ai)}
.fy{display:inline-grid;place-items:center;width:14px;height:14px;border:1.5px solid var(--ai);border-radius:50%;font-size:.58rem;font-style:normal;color:var(--ai);line-height:1}
.tk{margin-top:8px;padding-top:8px;border-top:1px dashed rgba(128,128,128,.4);font-size:.82rem}
.tk b{margin-right:8px;color:var(--ai);font-size:.74rem}
.xf{display:flex;align-items:center;gap:8px;margin:11px 0;font-size:.74rem;color:var(--sub)}
.xf::before,.xf::after{content:"";flex:1;height:1px;background:rgba(128,128,128,.35)}
/* ---- responsive ---- */
html{-webkit-text-size-adjust:100%}
.wrap{padding-left:max(22px,env(safe-area-inset-left));padding-right:max(22px,env(safe-area-inset-right))}
.side{display:contents}
nav button em{display:none}
nav .wrap{scroll-snap-type:x proximity}
nav button{scroll-snap-align:center;min-height:52px}
@media(max-width:600px){
 header{padding-top:calc(env(safe-area-inset-top) + 28px);padding-bottom:18px}
 .vt{font-size:2.5rem}
 .dh{padding-top:26px}
 .dh h2{font-size:2.5rem}
 .pn button{padding:13px 12px}
}
@media(min-width:900px){
 .app{display:grid;grid-template-columns:300px minmax(0,1fr);max-width:1120px;margin:0 auto}
 .side{display:block;position:sticky;top:0;align-self:start;height:100vh;overflow-y:auto;padding-bottom:32px;border-right:1px solid var(--line)}
 .side .wrap{max-width:none;padding:0 20px 0 28px}
 header{padding-top:60px}
 .vt{font-size:3.6rem}
 nav{position:static;background:none;backdrop-filter:none;-webkit-backdrop-filter:none;border:0;padding:0}
 nav .wrap{flex-direction:column;overflow:visible;gap:2px;padding:0 12px 0 0}
 nav button{display:flex;align-items:baseline;gap:12px;text-align:left;width:100%;min-width:0;min-height:0;border-bottom:0;border-left:2px solid transparent;padding:10px 14px}
 nav button:hover{color:var(--ink)}
 nav button[aria-selected=true]{border-left-color:var(--shu);background:var(--paper)}
 nav button em{display:block;order:-1;width:3.4rem;font-style:normal;font-size:.8rem}
 nav button span{font-size:1.15rem}
 nav button i{display:inline;font-size:.82rem}
 .content .wrap{max-width:800px;padding:0 56px}
 .dh{padding-top:60px}
 .dh h2{font-size:3.8rem}
 .pn{display:none}
 ol{margin-top:36px}
}

/* ---- themes ---- */
html[data-theme=snow]{}
html[data-theme=night]{color-scheme:dark;--bg:#0e1726;--paper:#152238;--ink:#e9eef7;--sub:#8c9bb3;--line:#26344d;--ai:#e2b66a;--ai2:#1c2c47;--shu:#f08a6c;--shu2:#2d2330}
html[data-theme=sakura]{--bg:#fbf4f5;--paper:#fff;--ink:#3a2a30;--sub:#9a8289;--line:#f0dde1;--ai:#b8506a;--ai2:#fbe7ec;--shu:#d9805f;--shu2:#fdeee7;--head:"Zen Maru Gothic",sans-serif;--body:"Zen Maru Gothic","Noto Sans TC",sans-serif;--r:16px;--r2:10px;--rs:20px}
html[data-theme=matcha]{--bg:#f3f5ef;--paper:#fff;--ink:#232a21;--sub:#7b8575;--line:#dfe4d6;--ai:#4a6b3a;--ai2:#e6eedd;--shu:#a8622f;--shu2:#f6ece2;--r:4px;--r2:3px;--rs:2px}
html[data-theme=coral]{--bg:#f2f9f9;--paper:#fff;--ink:#17323a;--sub:#6b868d;--line:#d5e7e8;--ai:#1d7a82;--ai2:#dff1f2;--shu:#e5604f;--shu2:#fdebe8;--head:"Zen Maru Gothic",sans-serif;--body:"Zen Maru Gothic","Noto Sans TC",sans-serif;--r:18px;--r2:12px;--rs:20px}
html[data-theme=coral] .vt{writing-mode:horizontal-tb;font-size:2.5rem;letter-spacing:.06em}
html[data-theme=coral] header .wrap{flex-direction:column;gap:10px}
html[data-theme=mono]{--bg:#fff;--paper:#fff;--ink:#111;--sub:#6f6f6f;--line:#d9d9d9;--ai:#111;--ai2:#efefef;--shu:#d7000f;--shu2:#fde8ea;--head:"Zen Kaku Gothic New",sans-serif;--body:"Zen Kaku Gothic New","Noto Sans TC",sans-serif;--r:0px;--r2:0px;--rs:0px}
html[data-theme=mono] .box,html[data-theme=mono] .hr,html[data-theme=mono] .pn button{border-color:var(--ink);border-width:1.5px}
html[data-theme=mono] .dh h2,html[data-theme=mono] .vt{font-weight:700}
html[data-theme=mono] nav{border-bottom:2px solid var(--ink)}
html[data-theme=sakura] .dh h2,html[data-theme=coral] .dh h2{font-weight:700}

/* ---- theme switcher ---- */
#tbtn{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));z-index:20;display:flex;align-items:center;gap:8px;padding:9px 15px;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:30px;font:inherit;font-size:.82rem;font-weight:700;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.12)}
#tbtn i{width:12px;height:12px;border-radius:50%;background:linear-gradient(135deg,var(--ai) 50%,var(--shu) 50%)}
#tpanel{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:calc(max(16px,env(safe-area-inset-bottom)) + 48px);z-index:20;width:min(300px,calc(100vw - 32px));background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:8px;box-shadow:0 8px 28px rgba(0,0,0,.18);display:none}
#tpanel.open{display:block}
#tpanel button{display:flex;align-items:center;gap:12px;width:100%;padding:9px 10px;background:none;border:1.5px solid transparent;border-radius:10px;font:inherit;font-size:.9rem;color:var(--ink);text-align:left;cursor:pointer}
#tpanel button:hover{background:var(--ai2)}
#tpanel button[aria-pressed=true]{border-color:var(--ai)}
#tpanel .sw{display:flex;flex:none;border-radius:20px;overflow:hidden;border:1px solid var(--line)}
#tpanel .sw b{width:18px;height:26px}
#tpanel small{display:block;color:var(--sub);font-size:.72rem;line-height:1.3}
</style>
</head>
<body>
<div class="app"><div class="side"><header><div class="wrap"><h1 class="vt">北海道</h1><div class="hd"><div class="sub">ALGS 行</div><div class="rng" id="range"></div><div class="seal">旅</div></div></div></header>
<nav><div class="wrap" id="tabs" role="tablist"></div></nav></div>
<div class="content"><main class="wrap" id="main"><div class="msg">載入中…</div></main>
<footer><div class="wrap" id="foot"></div></footer></div></div>
<script>
const SHEET_ID = '1NIDiUh2UruCk9V1omryTVxCpa3zkmqO-vBxFlnAEbQ4';
const REFRESH_MS = 60000;
// 若改用「發布到網路」CSV，貼在這裡；留空則用共用連結（gviz）
const PUB = { data: '', days: '' };
const gviz = n => `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&headers=1&sheet=${encodeURIComponent(n)}`;
const src = n => PUB[n] ? PUB[n] + (PUB[n].includes('?') ? '&' : '?') + 't=' + Date.now() : gviz(n);

function parseCSV(t){
  const rows=[];let r=[],c='',q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch=='"')q=true;
    else if(ch==','){r.push(c);c=''}
    else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;r.push(c);rows.push(r);r=[];c=''}
    else c+=ch}
  if(c||r.length){r.push(c);rows.push(r)}
  const h=rows.shift().map(s=>s.trim());
  return rows.filter(x=>x.some(v=>v.trim())).map(x=>Object.fromEntries(h.map((k,i)=>[k,(x[i]||'').trim()])));
}
async function get(name){
  let why1='';
  try{const r=await fetch(src(name),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);
    const t=await r.text();if(/^\s*<(!doctype|html)/i.test(t))throw new Error('回傳的是登入頁（試算表未公開）');return parseCSV(t)}
  catch(e){why1=e.message}
  try{const r=await fetch(name+'.csv',{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);return parseCSV(await r.text())}
  catch(e){throw new Error(`${name}：Google Sheet 失敗（${why1}）；本機 ${name}.csv 失敗（${e.message}）`)}
}
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mapUrl = it => {
  if(it.map==='-'||!it.place) return '';
  if(/^https?:/.test(it.map)) return it.map;
  return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(it.map||`${it.place} ${it.region}`);
};
const wk = md => {
  const [m,d]=(md||'').split('/').map(Number);if(!m||!d)return '';
  const n=new Date();let x=new Date(n.getFullYear(),m-1,d);
  if(n-x>1.55e10)x=new Date(n.getFullYear()+1,m-1,d);
  return '日月火水木金土'[x.getDay()];
};
const label = d => /^\d+$/.test(d.day)?d.day+'日目':d.day;
const CLOCK='<svg viewBox="0 0 16 16"><path d="M8 0a8 8 0 1 0 0 16A8 8 0 0 0 8 0zm0 14.2A6.2 6.2 0 1 1 8 1.8a6.2 6.2 0 0 1 0 12.4zM8.9 4H7.4v4.6l3.6 2.2.8-1.2-2.9-1.7z"/></svg>';
const PIN='<svg viewBox="0 0 16 16"><path d="M8 0a5.5 5.5 0 0 0-5.5 5.5C2.5 9.6 8 16 8 16s5.5-6.4 5.5-10.5A5.5 5.5 0 0 0 8 0zm0 7.6a2.1 2.1 0 1 1 0-4.2 2.1 2.1 0 0 1 0 4.2z"/></svg>';

let days=[],cur=location.hash.slice(1)?decodeURIComponent(location.hash.slice(1)):'';

function build(d,it){
  const map=new Map();
  d.forEach(x=>map.set(x.day,{...x,items:[]}));
  it.forEach(x=>{if(!map.has(x.day))map.set(x.day,{day:x.day,date:x.date,items:[]});map.get(x.day).items.push(x)});
  days=[...map.values()];
}
function pickDefault(){
  if(days.some(d=>d.day===cur))return;
  const n=new Date(),today=`${n.getMonth()+1}/${n.getDate()}`;
  cur=(days.find(d=>d.date===today&&d.day!=='備用')||days[0]).day;
}
const isSub=it=>/^(y|yes|是|v|1|true)$/i.test(it.sub||'');
function subHTML(s){
  const u=mapUrl(s),nm=s.place||s.detail;
  const name=u?`<a class="n1" href="${esc(u)}" target="_blank" rel="noopener">${esc(nm)}</a><a class="pin" href="${esc(u)}" target="_blank" rel="noopener" aria-label="在 Google 地圖開啟 ${esc(nm)}">${PIN}地圖</a>`:esc(nm);
  return `<div class="sr"><div class="sn"><div class="nm">${name}</div>`+(s.place&&s.detail?`<div class="sd">${esc(s.detail)}</div>`:'')+(s.note?`<div class="sd">${esc(s.note)}</div>`:'')+`</div>`+(s.hours?`<div class="sh">${CLOCK}${esc(s.hours)}</div>`:'')+`</div>`;
}
function itemHTML(it,subs=[]){
  const url=mapUrl(it), title=it.place||it.detail, detail=it.place?it.detail:'';
  const st=it.status?`<span class="s ${it.status==='已預訂'?'ok':'no'}">${esc(it.status)}</span>`:'';
  const t=url?`<a class="n1" href="${esc(url)}" target="_blank" rel="noopener">${esc(title)}</a><a class="pin" href="${esc(url)}" target="_blank" rel="noopener" aria-label="在 Google 地圖開啟 ${esc(title)}">${PIN}地圖</a>`:esc(title);
  return `<li class="${it.place||subs.length?'':'plain'}"><div class="t">${esc(it.time)}</div><div class="rail"></div><div class="b"><div class="title">${t}${st}</div>`+
    (it.hours?`<div class="hr">${CLOCK}營業 ${esc(it.hours)}</div>`:'')+
    (detail?`<div class="d">${esc(detail)}</div>`:'')+
    (it.transport?`<div class="tr">${esc(it.transport)}</div>`:'')+
    (it.note?`<div class="n">${esc(it.note)}</div>`:'')+(subs.length?`<div class="subs">${subs.map(subHTML).join('')}</div>`:'')+`</div></li>`;
}
function transitHTML(legs){
  const t=(legs.find(l=>l.time)||{}).time||'';
  const body=legs.map(l=>`<div class="leg"><div class="lh"><span class="md">${esc(l.mode)}</span>${l.line?`<b class="ln">${esc(l.line)}</b>`:''}${l.status?`<span class="s ${l.status==='已預訂'?'ok':'no'}">${esc(l.status)}</span>`:''}</div>`+
    (l.detail?`<div class="rt">${esc(l.detail)}</div>`:'')+
    ((l.ride||l.fare)?`<div class="mt">${l.ride?`<span>${CLOCK}${esc(l.ride)}</span>`:''}${l.fare?`<span><i class="fy">¥</i>${esc(l.fare)}</span>`:''}</div>`:'')+
    (l.ticket?`<div class="tk"><b>購票</b>${esc(l.ticket)}</div>`:'')+
    (l.note?`<div class="sd">${esc(l.note)}</div>`:'')+`</div>`).join('<div class="xf">轉乘</div>');
  return `<li class="go"><div class="t">${esc(t)}</div><div class="rail"></div><div class="b"><div class="tc">${body}</div></div></li>`;
}
function groupItems(items){
  const g=[];
  items.forEach(it=>{
    const last=g[g.length-1];
    if(it.mode){if(last&&last.legs)last.legs.push(it);else g.push({legs:[it]})}
    else if(isSub(it)&&last&&last.it)last.subs.push(it);
    else g.push({it,subs:[]});
  });
  return g;
}
function render(animate){
  pickDefault();
  const idx=days.findIndex(d=>d.day===cur), day=days[idx];
  document.getElementById('tabs').innerHTML=days.map(d=>
    `<button role="tab" data-day="${esc(d.day)}" aria-selected="${d.day===cur}"><span>${esc(d.date||'')}</span><i>${esc(wk(d.date)||label(d))}</i><em>${esc(label(d))}</em></button>`).join('');
  const dates=days.filter(d=>d.day!=='備用').map(d=>d.date);
  document.getElementById('range').textContent=dates.length?`${dates[0]} – ${dates[dates.length-1]}`:'';
  const info=[];
  if(day.weather)info.push(`<div class="box"><b>天</b><div class="v">${esc(day.weather)}</div></div>`);
  if(day.hotel)info.push(`<div class="box"><b>宿</b><div class="v"><strong>${esc(day.hotel)}</strong>${day.hotel_note?`<span>${esc(day.hotel_note)}</span>`:''}</div></div>`);
  const prev=days[idx-1],next=days[idx+1];
  document.getElementById('main').innerHTML=`<div class="${animate?'fade':''}"><div class="dh"><div class="dn">${esc(label(day))}</div><h2>${esc(day.date||'')}<small>${esc(wk(day.date))}</small></h2>`+
    (info.length?`<div class="info">${info.join('')}</div>`:'')+`</div><ol>${groupItems(day.items).map(g=>g.legs?transitHTML(g.legs):itemHTML(g.it,g.subs)).join('')}</ol>`+
    `<div class="pn">${prev?`<button data-day="${esc(prev.day)}">‹ ${esc(prev.date)}</button>`:''}${next?`<button class="nx" data-day="${esc(next.day)}">${esc(next.date)} ›</button>`:''}</div></div>`;
  document.title=`${label(day)} ${day.date} ｜ 北海道 ALGS 行`;
}
function go(d){
  if(!d||d===cur)return;
  cur=d;history.replaceState(null,'','#'+encodeURIComponent(cur));
  render(true);scrollTo({top:0});
  document.querySelector('#tabs [aria-selected=true]')?.scrollIntoView({inline:'center',block:'nearest'});
}
document.addEventListener('click',e=>{const b=e.target.closest('button[data-day]');if(b)go(b.dataset.day)});
document.addEventListener('keydown',e=>{
  if(e.target.closest('input,textarea'))return;
  const i=days.findIndex(d=>d.day===cur);
  if(e.key==='ArrowLeft'&&days[i-1])go(days[i-1].day);
  if(e.key==='ArrowRight'&&days[i+1])go(days[i+1].day);
});
let sx=0,sy=0;
document.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
document.addEventListener('touchend',e=>{
  if(e.target.closest('nav,.tr'))return;
  const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)<70||Math.abs(dy)>45)return;
  const i=days.findIndex(d=>d.day===cur);
  go((dx<0?days[i+1]:days[i-1])?.day);
},{passive:true});

async function load(){
  try{
    const [d,it]=await Promise.all([get('days'),get('data')]);
    build(d,it);
    const first=!document.querySelector('.dh');
    const y=scrollY;render(false);if(!first)scrollTo(0,y);
    document.getElementById('foot').textContent='資料每分鐘自動更新｜最後更新 '+new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'});
  }catch(e){
    if(!days.length)document.getElementById('main').innerHTML='<div class="msg">讀取不到資料。請確認試算表已設為「知道連結的人可檢視」，且分頁名稱為 data 與 days。<br><small>'+esc(e.message)+'</small></div>';
  }
}

/* ---- theme switcher ---- */
const THEMES=[
 ['snow','雪白','日系簡約・明朝體・自動深色','#f6f8f8','#27415f','#b4452f'],
 ['night','夜雪','深藍夜色・琥珀點綴','#0e1726','#e2b66a','#f08a6c'],
 ['sakura','櫻','圓潤可愛・手帳風','#fbf4f5','#b8506a','#d9805f'],
 ['matcha','抹茶','沉穩自然・綠與茶','#f3f5ef','#4a6b3a','#a8622f'],
 ['coral','珊瑚海','清爽活潑・圓體・橫排標題','#f2f9f9','#1d7a82','#e5604f'],
 ['mono','黑白','高對比・直角・雜誌感','#ffffff','#111111','#d7000f']
];
function setTheme(id){
  document.documentElement.dataset.theme=id;
  try{localStorage.setItem('theme',id)}catch(e){}
  document.querySelectorAll('#tpanel button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.t===id));
}
if(SHOW_SWITCHER){
  const p=document.createElement('div');p.id='tpanel';
  p.innerHTML=THEMES.map(t=>`<button data-t="${t[0]}" aria-pressed="false"><span class="sw"><b style="background:${t[3]}"></b><b style="background:${t[4]}"></b><b style="background:${t[5]}"></b></span><span>${t[1]}<small>${t[2]}</small></span></button>`).join('');
  const b=document.createElement('button');b.id='tbtn';b.innerHTML='<i></i>配色';
  b.onclick=()=>p.classList.toggle('open');
  p.onclick=e=>{const x=e.target.closest('button');if(x)setTheme(x.dataset.t)};
  document.addEventListener('click',e=>{if(!e.target.closest('#tpanel,#tbtn'))p.classList.remove('open')});
  document.body.append(p,b);setTheme(document.documentElement.dataset.theme);
}
load();setInterval(load,REFRESH_MS);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});
</script>
